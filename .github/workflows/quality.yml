name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-matrix:
    name: quality (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      RUDI_CLI_TEST_WRAPPER_ACTIVE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify generated distribution
        run: git diff --exit-code -- dist src/packages-manifest.json

      - name: Scan changed JavaScript and TypeScript debt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          node scripts/agent-debt-runner.mjs --changed-since "$BASE_SHA" --no-log

      - name: Verify package contents
        run: npm pack --dry-run

  quality:
    name: quality
    needs: quality-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all Node versions to pass
        env:
          QUALITY_RESULT: ${{ needs.quality-matrix.result }}
        run: test "$QUALITY_RESULT" = success
